version: "3.9"

services:
  api:
    build: ./backend
    container_name: tarot-api
    restart: always
    ports:
      - "8188:8188"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_started
    networks:
      - tarot

  redis:
    image: redis:7-alpine
    container_name: tarot-redis
    restart: always
    command: redis-server --requirepass redis@123
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - tarot

networks:
  tarot:
    driver: bridge
