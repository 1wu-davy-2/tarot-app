# 命运之镜 · 服务器 Nginx 配置
# ─────────────────────────────────────────────────────────
# 部署路径: /etc/nginx/sites-available/default 或 /etc/nginx/nginx.conf
#
# 部署步骤:
#   1. 复制此文件到服务器 nginx 配置目录
#   2. cp landing/index.html /usr/share/nginx/html/index.html
#   3. mkdir -p /usr/share/nginx/html/apk && cp tarot-app.apk /usr/share/nginx/html/apk/
#   4. Docker 容器设置环境变量 BASE_PATH=/tarot 并重建
#   5. nginx -t && systemctl reload nginx

# ── Upgrade header 映射（WebSocket 用）─────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTPS 主服务器 ──────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name lightpulse.fun www.lightpulse.fun 14.103.242.161;

    ssl_certificate /etc/nginx/ssl/server.pem;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 1. 根目录：命运之镜着陆页
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # 2. 命运之镜 Web 应用 → Docker 前端 (Next.js :5200)
    #    尾部斜杠去掉 /tarot 前缀，Next.js 收到的是 /xxx
    location /tarot/ {
        proxy_pass http://127.0.0.1:5200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # 3. 命运之镜 API → Docker 后端 (:8188)
    location /api/ {
        proxy_pass http://127.0.0.1:8188/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持（AI 解读需要）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        client_max_body_size 10m;
    }

    # 4. Zabbix 服务
    location ^~ /yw {
        alias /usr/share/zabbix;
        index index.php;
        try_files $uri $uri/ /yw/index.php?$args;

        location ~ ^/yw/(.+\.php)$ {
            alias /usr/share/zabbix/$1;
            fastcgi_pass unix:/run/php-fpm/zabbix.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_read_timeout 180;
        }

        location ~ ^/yw/(assets|fonts|styles|js|img|vendor|local|audio)(/.*)$ {
            alias /usr/share/zabbix/$1$2;
            access_log off;
            expires 10d;
            add_header Access-Control-Allow-Origin *;
        }

        location ~ ^/yw/(conf[^\.]|include|locale) {
            deny all;
            return 404;
        }
    }

    # 5. zcc
    location /zcc {
        alias /opt/zcc-production/;
        index index.html;
        try_files $uri $uri/ /zcc/index.html;
    }

    # 6. LightPulse
    location ^~ /lightpulse/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /lightpulse/ {
        alias /opt/lightpulse/web/;
        index index.html;
        try_files $uri $uri/ /lightpulse/index.html;
    }

    # 7. HiddenChatt
    location /chat {
        alias /opt/hiddenchatt/web/;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /chat/api/ {
        rewrite ^/chat/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # ── 安全加固 ──────────────────────────────────────
    server_tokens off;

    location ~ /\. {
        deny all;
    }
}
