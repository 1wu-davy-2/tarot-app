# Tarot App — Nginx reverse proxy
# 前端 :5200 / 后端 :8188 → 统一入口 :80
#
# 服务器部署：
#   cp nginx/tarot-app.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/tarot-app.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;  # 替换为你的域名，如 example.com

    # 日志
    access_log /var/log/nginx/tarot-access.log;
    error_log /var/log/nginx/tarot-error.log;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ── 后端 API（含 SSE 流式）─────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8188;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持（AI 解读需要）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 上传文件大小限制
        client_max_body_size 10m;
    }

    # ── 前端 Next.js ───────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5200;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js WebSocket（HMR / 热更新，生产可省略）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
    }

    # ── 安全加固 ───────────────────────────────────────────────
    # 隐藏 nginx 版本
    server_tokens off;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

# ── Upgrade header 映射（WebSocket 用）────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
