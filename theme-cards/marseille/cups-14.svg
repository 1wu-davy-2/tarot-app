<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf3e0"/>
      <stop offset="100%" stop-color="#f0e6c8"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" rx="12"/>
  <rect x="16" y="16" width="268" height="468" fill="none" stroke="#2980b9" stroke-width="2.5" rx="8"/>
  <rect x="22" y="22" width="256" height="456" fill="none" stroke="#1a3a6b" stroke-width="1" rx="6"/>
  <!-- Top: suit + number -->
  <text x="150" y="65" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#2980b9" font-weight="bold">圣杯国王</text>
  <text x="150" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8b1a1a">King of Cups</text>
  <!-- Center: symbols -->
  
  <!-- If court card (11-14), show large symbol + role icon -->
  <text x="150" y="280" font-size="80" fill="#2980b9" text-anchor="middle" opacity="0.7">🜄</text>
  <text x="150" y="370" font-size="28" fill="#2980b9" text-anchor="middle" font-weight="bold">国王</text>
  <!-- Bottom -->
  <text x="150" y="440" text-anchor="middle" font-size="16" fill="#1a3a6b">圣杯</text>
  <!-- Corners -->
  <text x="30" y="35" font-size="12" fill="#2980b9" opacity="0.6">🜄</text>
  <text x="270" y="35" font-size="12" fill="#2980b9" opacity="0.6">🜄</text>
  <text x="30" y="482" font-size="12" fill="#2980b9" opacity="0.6">🜄</text>
  <text x="270" y="482" font-size="12" fill="#2980b9" opacity="0.6">🜄</text>
</svg>