<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="500" fill="url(#bg)" rx="8"/>
  <!-- Subtle border -->
  <rect x="12" y="12" width="276" height="476" fill="none" stroke="rgba(212,168,83,0.3)" stroke-width="1" rx="6"/>
  <!-- Top line accent -->
  <line x1="60" y1="50" x2="240" y2="50" stroke="rgba(212,168,83,0.4)" stroke-width="0.5"/>
  <!-- Roman numeral -->
  <text x="150" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="rgba(212,168,83,0.5)" font-weight="300" letter-spacing="6">I</text>
  <!-- Center: geometric ornament -->
  <circle cx="150" cy="230" r="75" fill="none" stroke="rgba(212,168,83,0.12)" stroke-width="0.5"/>
  <circle cx="150" cy="230" r="50" fill="none" stroke="rgba(212,168,83,0.08)" stroke-width="0.5" stroke-dasharray="3 5"/>
  <text x="150" y="255" text-anchor="middle" font-size="64" fill="rgba(192,132,252,0.5)">✧</text>
  <!-- Number -->
  <text x="150" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">01</text>
  <!-- Bottom section -->
  <line x1="60" y1="380" x2="240" y2="380" stroke="rgba(212,168,83,0.3)" stroke-width="0.5"/>
  <text x="150" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#d4a853" font-weight="300" letter-spacing="2">魔术师</text>
  <text x="150" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" letter-spacing="3">THE MAGICIAN</text>
</svg>